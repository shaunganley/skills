name: Update skills page

on:
  push:
    branches: [main]
    paths:
      - "**/SKILL.md"
      - ".github/scripts/build_pages.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Regenerate docs/index.md
        run: python3 .github/scripts/build_pages.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.md
          git diff --cached --quiet || git commit -m "Update skills listing [skip ci]"
          git push
